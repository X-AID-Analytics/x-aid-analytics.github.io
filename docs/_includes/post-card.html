<div class="card is-horizontal post-card">
    <div class="card-content">
        <div class="media">
            <div class="media-left">
                <figure class="image is-96x96">
                    <img src="/assets/img/{{ post.image }}" alt="Post Image">
                </figure>
            </div>
        </div>
        <div class="content">

            {% if post.image %}
                <a class="title is-4" href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
            {% endif %}
            {% if post.summary %}
                {{ post.summary | markdownify }}
            {% else %}
                <p>{{ post.excerpt }}</p>
            {% endif %}
        </div>
        <!-- <div class="has-text-left">
            <a href="{{ site.baseurl }}{{ post.url }}" class="button is-small is-primary">Read more</a>
        </div> -->
    </div>
    <footer class="card-footer">
        <p class="card-footer-item has-text-left">Published by {{ post.author }} on {{ post.date | date: '%b %-d, %Y' }}</p>
    </footer>
</div>

<!-- Contact: Banner + callout message -->
<section id="contact-banner" class="hero is-halfheight has-bg-img">
    <div class="hero-body">
        <div class="container">
            <h1 class="title has-text-white">CONTACT US</h1>
        </div>
    </div>
</section>

<!-- Contact: Form -->
<section id="contact-form" class="section hero is-light">
    <div class="hero-body">
        <div class="container is-max-tablet">

            <h1 class="title is-2 is-midium is-uppercase">Have Questions?</h1>

            <div class="notification is-primary mt-4">
                <p class="is-4">Send us a message or create a <a href="https://github.com/X-AID-Analytics/x-aid-analytics.github.io/issues">github issue</a></p>
            </div>

            <form action="https://fabform.io/f/rDmRHFs" method="post">

                <div class="field">
                    <label class="label" for="name">Name</label>
                    <div class="control">
                        <input id="name" class="input" name="name" type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="email">Email</label>
                    <div class="control">
                        <input id="email" class="input" name="email" type="email" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="message">Message</label>
                    <div class="control">
                        <textarea id="message" class="textarea" name="message" required></textarea>
                    </div>
                </div>

                <div class="field">
                    <div class="control">
                        <input class="button is-primary" type="submit" value="Submit">
                    </div>
                </div>

            </form>
        </div>
    </div>
</section>
